name: Contract tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy 'scikit-learn>=1.6,<1.9' pyyaml joblib
      - run: python -m unittest discover -s tests -v
